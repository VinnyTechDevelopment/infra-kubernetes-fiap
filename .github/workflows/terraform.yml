name: Terraform infra-kubernetes

# NOTA (AWS Academy): o Academy não permite criar um IAM OIDC provider, então
# a autenticação via role assumida (OIDC) do workflow original não funciona
# aqui. Em vez disso, usamos as 3 credenciais temporárias que o Academy gera
# a cada sessão (Access Key, Secret Key, Session Token). Antes ficavam como
# secret por repositório e precisavam ser atualizadas em cada um a cada
# sessão nova do Lab; agora são secret de nível de Organization no GitHub, e
# atualizar uma vez propaga pra todos os repositórios. Por isso o apply em
# `main` voltou a ser automático — mas a sessão do Lab ainda expira em
# poucas horas, então um push pode falhar se ela tiver caído nesse meio
# tempo; nesse caso basta atualizar o secret da organization e re-rodar o
# job manualmente (ou via `workflow_dispatch`, que continua existindo como
# fallback).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_REGION: us-east-1
      # License Key já está nos secrets da organization — liga a integração
      # de infraestrutura do New Relic no cluster (ver newrelic.tf).
      TF_VAR_newrelic_enabled: "true"
      TF_VAR_newrelic_license_key: ${{ secrets.NEWRELIC_LICENSE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: >
          terraform init
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
          -backend-config="key=infra-kubernetes/terraform.tfstate"
          -backend-config="region=us-east-1"
          -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: terraform apply -auto-approve
